# Minimal stack for a small host, including free tiers.
#
#   docker compose -f docker-compose.free.yml up -d --build
#
# Differences from docker-compose.prod.yml:
#   * no worker  -- ingestion runs inside the API process (INLINE_INGESTION)
#   * no redis   -- nothing left to queue
#
# Two containers instead of four, and no managed Redis to pay for. The trade is that a
# large upload competes with request handling and ingestion runs one document at a time.
# Since embedding moved to the provider's API this costs far less than it used to: the
# worker is no longer holding a second copy of a 330 MB model, it is mostly waiting on HTTP.
#
# Once you outgrow it, docker-compose.prod.yml is the same app with the worker restored.

services:
  api:
    build: ./api
    image: rag-api
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Set here rather than in .env.production so this file is self-describing: the
      # whole point of this stack is that there is no worker to hand jobs to.
      INLINE_INGESTION: "true"
    volumes:
      - storage:/app/storage
    expose:
      - "8000"
    # No model in the process, so this is FastAPI and the parsers plus one document's
    # vectors. Measured at ~205 MB with 200 chunks embedded in a single call -- the case
    # that used to OOM. 512m is that with room, and a ceiling so a leak cannot take the
    # host's OS down with it.
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80" # required for the ACME challenge, not just redirects
      - "443:443"
    env_file: .env.production # Caddy reads only API_DOMAIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data # issued certificates -- losing this re-requests them
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  storage:
  caddydata:
  caddyconfig:
