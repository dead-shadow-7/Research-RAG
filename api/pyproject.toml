[project]
name = "rag-api"
version = "0.1.0"
description = "RAG backend: document ingestion, Pinecone retrieval, Claude generation"
requires-python = ">=3.14"

# Pinned deliberately: the langchain-* ecosystem moves fast and minor releases
# have moved import paths before.
dependencies = [
    # web
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "python-multipart==0.0.32",
    # datastores
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "arq==0.28.0",
    # config
    "pydantic-settings==2.15.0",
    # langchain (components only -- no langchain-community / langchain-classic)
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "langchain-text-splitters==1.1.2",
    # vector store (direct SDK; langchain-pinecone caps at python <3.14
    # and drags in langchain-openai)
    "pinecone==10.0.0",
    # embeddings: local ONNX, no torch / no transformers
    "fastembed==0.8.0",
    "tokenizers==0.23.2",
    # parsing
    "pymupdf==1.28.2",
    "docx2txt==0.9",
    "openpyxl==3.1.5",
    "trafilatura==2.2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.ingestion"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
